$schema: https://azuremlschemas.azureedge.net/latest/commandComponent.schema.json
type: command
name: puntuar_modelo
display_name: Puntuar Modelo (Score Model)
description: Agrega Scored Labels. Equivale a Score Model.
version: "1"

inputs:
  modelo:
    type: mlflow_model
  datos:
    type: mltable
  columna_objetivo:
    type: string
    default: charges

outputs:
  datos_puntuados:
    type: mltable

code: ../src
environment: azureml:env-designer-custom@latest

command: >-
  python puntuar_modelo.py
  --modelo ${{inputs.modelo}}
  --datos ${{inputs.datos}}
  --columna_objetivo ${{inputs.columna_objetivo}}
  --datos_puntuados ${{outputs.datos_puntuados}}
