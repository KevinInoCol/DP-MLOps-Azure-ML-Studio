# Entorno compartido por TODOS los componentes del proyecto.
# Agrega aquí tus librerías (p. ej. xgboost, lightgbm) y vuelve a registrar
# el entorno con: tools/registrar.sh --entorno --nueva-version
name: designer-custom
channels:
  - conda-forge
dependencies:
  - python=3.10
  - pip
  - setuptools<81          # mltable/azureml-dataprep aún importan pkg_resources
  - pip:
      - pandas==2.2.3
      - scikit-learn==1.5.2
      - mltable==1.6.1
      - azureml-fsspec==1.3.1
      - mlflow==2.17.2
      - azureml-mlflow==1.60.0
